name: Deploy Docker Image on Dokploy

inputs:
    DOKPLOY_HOST:
      description: "The host of the Dokploy instance"
      required: true

    DOKPLOY_TOKEN:
      description: "The token to authenticate with Dokploy"
      required: true

    APPLICATION_ID:
      description: "The ID of the application to deploy"
      required: true

    DOCKER_REGISTRY:
      description: "The full docker image name"
      required: true

    DOCKER_TAG:
      description: "The docker tag name"
      required: true

    RELEASE_DESCRIPTION:
      description: "The description of the release"
      required: false

runs:
  using: "composite"
  steps:
    - name: Deploy
      shell: bash
      run: |
        curl -X 'POST' \
          '${{ inputs.DOKPLOY_HOST }}/api/application.saveDockerProvider' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -H 'x-api-key: ${{ inputs.DOKPLOY_TOKEN }}' \
          -d '{
          "dockerImage": "${{ inputs.DOCKER_REGISTRY }}:${{ inputs.DOCKER_TAG }}",
          "applicationId": "${{ inputs.APPLICATION_ID }}",
          "username": "",
          "password": "",
          "registryUrl": ""
        }'

        # Escape the release body for JSON
        RELEASE_BODY=$(echo '${{ inputs.RELEASE_DESCRIPTION }}' | jq -Rs .)

        curl -X 'POST' \
          '${{ inputs.DOKPLOY_HOST }}/api/application.deploy' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -H 'x-api-key: ${{ inputs.DOKPLOY_TOKEN }}' \
          -d "{
          \"applicationId\": \"${{ inputs.APPLICATION_ID }}\",
          \"title\": \"Deploying ${{ inputs.DOCKER_TAG }}\",
          \"description\": $RELEASE_BODY
        }"
