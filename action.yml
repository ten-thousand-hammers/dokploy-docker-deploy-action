name: Deploy Docker Image on Dokploy

inputs:
    DOKPLOY_HOST:
      description: "The host of the Dokploy instance"
      required: true

    DOKPLOY_TOKEN:
      description: "The token to authenticate with Dokploy"
      required: true

    APPLICATION_ID:
      description: "The ID of the application to deploy (can be a single ID or comma-separated list of IDs)"
      required: true

    DOCKER_REGISTRY:
      description: "The full docker image name"
      required: true

    DOCKER_TAG:
      description: "The docker tag name"
      required: true

    RELEASE_DESCRIPTION:
      description: "The description of the release"
      required: false

    WAIT:
      description: >-
        Wait for every deployment to finish and fail if any of them does not
        reach "done". Without this the action returns as soon as Dokploy accepts
        the request, so a container that never boots still reports success.
      required: false
      default: "false"

    WAIT_ATTEMPTS:
      description: "How many times to poll each application before giving up."
      required: false
      default: "60"

    WAIT_INTERVAL_SECONDS:
      description: "Seconds between polls."
      required: false
      default: "10"

runs:
  using: "composite"
  steps:
    - name: Parse Application IDs
      shell: bash
      run: |
        set -e

        # Convert APPLICATION_ID input to array, handling both single values and comma-separated lists
        IFS=',' read -ra APP_IDS <<< "${{ inputs.APPLICATION_ID }}"

        # Clean up whitespace and export for next steps
        CLEAN_IDS=()
        for id in "${APP_IDS[@]}"; do
          # Trim whitespace
          clean_id=$(echo "$id" | xargs)
          if [ -n "$clean_id" ]; then
            CLEAN_IDS+=("$clean_id")
          fi
        done

        # An empty or whitespace-only input would otherwise leave every loop
        # below with nothing to iterate over, and the action would report
        # success without having deployed anything.
        if [ "${#CLEAN_IDS[@]}" -eq 0 ]; then
          echo "::error::APPLICATION_ID is empty; nothing to deploy"
          exit 1
        fi

        # Export the IDs as a space-separated string for the next steps
        printf "%s\n" "${CLEAN_IDS[@]}" > /tmp/app_ids.txt
        echo "Found ${#CLEAN_IDS[@]} application ID(s): ${CLEAN_IDS[*]}"

    # Taken before anything is deployed. Dokploy's deploy endpoint does not
    # return the deployment it created, so the only way to identify it later is
    # to know which ones already existed -- otherwise a re-deploy of the same tag
    # would match an older, already-successful deployment and return immediately.
    - name: Snapshot existing deployments
      if: ${{ inputs.WAIT == 'true' }}
      shell: bash
      env:
        DOKPLOY_HOST: ${{ inputs.DOKPLOY_HOST }}
        DOKPLOY_TOKEN: ${{ inputs.DOKPLOY_TOKEN }}
      run: |
        set -euo pipefail

        mapfile -t APP_IDS < /tmp/app_ids.txt

        for app_id in "${APP_IDS[@]}"; do
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            --get "$DOKPLOY_HOST/api/deployment.all" \
            --header "x-api-key: $DOKPLOY_TOKEN" \
            --data-urlencode "applicationId=$app_id")

          if ! jq -e 'type == "array"' <<< "$response" >/dev/null; then
            echo "Error: unexpected deployment list for $app_id" >&2
            exit 1
          fi

          jq -c '[.[].deploymentId]' <<< "$response" > "/tmp/baseline_${app_id}.json"
          echo "Baselined $(jq 'length' < "/tmp/baseline_${app_id}.json") deployment(s) for $app_id"
        done

    - name: Save Docker Provider Configuration
      shell: bash
      env:
        # Through the environment rather than interpolated into the script: a
        # release body containing a quote would otherwise break the command, and
        # anything in it would be evaluated by the shell.
        RELEASE_DESCRIPTION: ${{ inputs.RELEASE_DESCRIPTION }}
      run: |
        set -e

        # Escape the release body for JSON (prepare for later use)
        RELEASE_BODY=$(printf '%s' "$RELEASE_DESCRIPTION" | jq -Rs .)
        printf 'RELEASE_BODY=%s\n' "$RELEASE_BODY" >> "$GITHUB_ENV"

        # Read application IDs
        mapfile -t APP_IDS < /tmp/app_ids.txt

        for app_id in "${APP_IDS[@]}"; do
          echo "Saving Docker provider configuration for application: $app_id"

          response=$(curl -s -w "\n%{http_code}" -X 'POST' \
            '${{ inputs.DOKPLOY_HOST }}/api/application.saveDockerProvider' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ inputs.DOKPLOY_TOKEN }}' \
            -d "{
            \"dockerImage\": \"${{ inputs.DOCKER_REGISTRY }}:${{ inputs.DOCKER_TAG }}\",
            \"applicationId\": \"$app_id\",
            \"username\": \"\",
            \"password\": \"\",
            \"registryUrl\": \"\"
          }")

          # Extract HTTP status code and response body
          http_code=$(echo "$response" | tail -n1)
          response_body=$(echo "$response" | head -n -1)

          if [ "$http_code" -ne 200 ]; then
            echo "Error: Failed to save Docker provider configuration for application $app_id"
            echo "HTTP Status: $http_code"
            echo "Response: $response_body"
            exit 1
          fi

          echo "✓ Docker provider configuration saved successfully for application: $app_id"
        done

    - name: Deploy Applications
      shell: bash
      run: |
        set -e

        # Read application IDs
        mapfile -t APP_IDS < /tmp/app_ids.txt

        for app_id in "${APP_IDS[@]}"; do
          echo "Deploying application: $app_id"

          deploy_response=$(curl -s -w "\n%{http_code}" -X 'POST' \
            '${{ inputs.DOKPLOY_HOST }}/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ inputs.DOKPLOY_TOKEN }}' \
            -d "{
            \"applicationId\": \"$app_id\",
            \"title\": \"Deploying ${{ inputs.DOCKER_TAG }}\",
            \"description\": $RELEASE_BODY
          }")

          # Extract HTTP status code and response body for deploy request
          deploy_http_code=$(echo "$deploy_response" | tail -n1)
          deploy_response_body=$(echo "$deploy_response" | head -n -1)

          if [ "$deploy_http_code" -ne 200 ]; then
            echo "Error: Failed to deploy application $app_id"
            echo "HTTP Status: $deploy_http_code"
            echo "Response: $deploy_response_body"
            exit 1
          fi

          echo "✓ Application deployed successfully: $app_id"
          echo "Deploy response: $deploy_response_body"
        done

        echo "🎉 All applications deployed successfully!"

    - name: Wait for deployments
      if: ${{ inputs.WAIT == 'true' }}
      shell: bash
      env:
        DOKPLOY_HOST: ${{ inputs.DOKPLOY_HOST }}
        DOKPLOY_TOKEN: ${{ inputs.DOKPLOY_TOKEN }}
        DOCKER_TAG: ${{ inputs.DOCKER_TAG }}
        WAIT_ATTEMPTS: ${{ inputs.WAIT_ATTEMPTS }}
        WAIT_INTERVAL_SECONDS: ${{ inputs.WAIT_INTERVAL_SECONDS }}
      run: |
        set -euo pipefail

        mapfile -t APP_IDS < /tmp/app_ids.txt
        deployment_title="Deploying $DOCKER_TAG"
        failed=0

        # Every application is waited on, even after one fails, so the log shows
        # the whole picture rather than stopping at the first bad one.
        for app_id in "${APP_IDS[@]}"; do
          echo "::group::Waiting for $app_id"
          existing="$(cat "/tmp/baseline_${app_id}.json")"
          result="timeout"

          for attempt in $(seq 1 "$WAIT_ATTEMPTS"); do
            response=$(curl --fail-with-body --silent --show-error --retry 3 \
              --get "$DOKPLOY_HOST/api/deployment.all" \
              --header "x-api-key: $DOKPLOY_TOKEN" \
              --data-urlencode "applicationId=$app_id")

            deployment=$(jq -c \
              --arg title "$deployment_title" \
              --argjson existing "$existing" '
              [
                .[]
                | select(.title == $title)
                | select(.deploymentId as $id | ($existing | index($id)) == null)
              ]
              | sort_by(.createdAt)
              | last // empty
            ' <<< "$response")

            if [ -z "$deployment" ]; then
              echo "Waiting for Dokploy to create the deployment ($attempt/$WAIT_ATTEMPTS)"
            else
              status=$(jq -r '.status' <<< "$deployment")
              echo "Deployment $(jq -r '.deploymentId' <<< "$deployment") is $status ($attempt/$WAIT_ATTEMPTS)"
              case "$status" in
                done) result="done"; break ;;
                error|cancelled)
                  jq -r '.errorMessage // "Deployment failed"' <<< "$deployment" >&2
                  result="$status"; break
                  ;;
                running) ;;
                *) echo "Unexpected status: $status" >&2; result="unknown"; break ;;
              esac
            fi

            [ "$attempt" -lt "$WAIT_ATTEMPTS" ] && sleep "$WAIT_INTERVAL_SECONDS"
          done

          echo "::endgroup::"
          if [ "$result" = "done" ]; then
            echo "✓ $app_id deployed"
          else
            echo "::error::$app_id did not deploy ($result)"
            failed=1
          fi
        done

        [ "$failed" -eq 0 ] || exit 1
        echo "🎉 All deployments reached done"
